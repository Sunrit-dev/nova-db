[workspace]
resolver = "2"
members = [
    "crates/nova-core",
    "crates/nova-storage",
    "crates/nova-index",
    "crates/nova-query",
    "crates/nova-protocol",
    "crates/nova-server",
    "crates/nova-client",
    "crates/nova-cli",
    "crates/nova-testkit",
    "examples",
    "benchmarks",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Sunrit Biswas", "Nova DB Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sunrit-dev/nova-db"
homepage = "https://github.com/Sunrit-dev/nova-db"
readme = "README.md"
description = "A database that understands the flow of your data."

[workspace.dependencies]
# Internal crates
nova-core = { path = "crates/nova-core" }
nova-storage = { path = "crates/nova-storage" }
nova-index = { path = "crates/nova-index" }
nova-query = { path = "crates/nova-query" }
nova-protocol = { path = "crates/nova-protocol" }
nova-server = { path = "crates/nova-server" }
nova-client = { path = "crates/nova-client" }
nova-testkit = { path = "crates/nova-testkit" }

# Async runtime & I/O
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
bytes = "1.7"
futures = "0.3"

# Serialization & binary
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
crc32fast = "1.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Utilities & Error handling
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
tempfile = "3.12"

# CLI & UX
clap = { version = "4.5", features = ["derive", "cargo"] }
rustyline = "14.0"
colored = "2.1"
comfy-table = "7.1"
indicatif = "0.17"
